game_id: chrono_trigger
window:
  process_name: snes9x-x64.exe
ocr:
  region:
    x: 0.2117
    y: 0.5962
    w: 0.575
    h: 0.3166
  speaker_region:
    x: 0.1145
    y: 0.6131
    w: 0.1081
    h: 0.0626
  upscale_factor: 4
  binary_threshold: 148
  speaker_binary_threshold: 187
  cursor_mask_ratio: 0.1
  debounce_ms: 200
  engine: auto
  native_width: 256
  native_height: 224
  glyph_threshold: 160
  text_color: bright
# Read the dialogue from memory with RetroArch + Snes9x (Source: Game memory)
memory:
  command: read_core_ram
  text:
    # The dialogue printer's position in the script ($7E0231, 24-bit). Once a
    # box is full it rests just past the code ending it (00 end, 0B/0C page).
    cursor: {address: 0x231, size: 3}
    cursor_rests: after
    break_codes: ["00", "0B", "0C"]
    # After a choice the game can jump over a message that is never shown
    require_progress: true
    # The script is printed straight from the cartridge (dictionary-compressed)
    rom:
      sha1: de5822f4f2f7a55acb8926d4c0eaa63d5d989312
      mapping: hirom
    table_file: chrono_trigger.tbl
    newline_codes: ["05", "06"]
dialogue_rules:
  speaker_delimiter: ':'
  strip_patterns:
  - ^[\*\-]+\s*
  min_length: 2
  skip_choices: true
  # Entering an area shows its name in the dialogue box ("Leene Square")
  skip_place_names: true
controls:
  enabled: true
  skip_keys:
  - z
  - x
  - space
  - enter
  skip_gamepad_buttons:
  - 0
  - 1
  cooldown_ms: 250
