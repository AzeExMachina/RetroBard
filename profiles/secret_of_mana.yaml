game_id: secret_of_mana
window:
  process_name: snes9x-x64.exe
ocr:
  region:
    x: 0.2309
    y: 0.0597
    w: 0.5367
    h: 0.2284
  upscale_factor: 3
  binary_threshold: 180
  cursor_mask_ratio: 0.12
  debounce_ms: 200
  engine: auto
  native_width: 256
  native_height: 224
  glyph_threshold: 160
  text_color: white
# Read the dialogue from memory with RetroArch + Snes9x (Source: Game memory)
memory:
  command: read_core_ram
  text:
    # The dialogue renderer's position in the script ($7E1D01, 24-bit). It rests
    # on a script command (usually 28 00, wait for a button) once a box is full.
    cursor: {address: 0x1D01, size: 3}
    # The text is printed straight from the cartridge. Each user chooses their
    # ROM (retrobard set-rom, or Start asks); it must be this exact version.
    rom:
      sha1: 8133041a363e3cc68cedef40b49b6d20d03c505d
      mapping: hirom
    command_below: 0x7F
    table_file: secret_of_mana.tbl
    newline_codes: ["7F"]
dialogue_rules:
  speaker_delimiter: ':'
  strip_patterns:
  - ^[\*\-\|\s]+
  min_length: 2
  skip_choices: true
controls:
  enabled: true
  skip_keys:
  - z
  - x
  - space
  - enter
  skip_gamepad_buttons:
  - 0
  - 1
  cooldown_ms: 250
