[project]
name = "retrobard"
version = "0.4.0"
description = "Real-time AI voice acting for retro games: reads a game's dialogue box and speaks it."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Aze", email = "retro.bard.voice@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "elevenlabs>=1.15.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "pygame>=2.6.1",
    "typer>=0.12.5",
    "numpy>=2.1.0",
    "opencv-python>=4.10.0",
    "windows-capture>=2.0.1; sys_platform == 'win32'",
    "pyside6>=6.12.0",
    "keyring>=25.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://aze-ex-machina.itch.io/retrobard"
Source = "https://github.com/AzeExMachina/RetroBard"
Author = "https://davidealdegheri.dev/"

[project.optional-dependencies]
# Generic OCR fallback for games without a taught font (pulls in torch, about 1 GB)
easyocr = [
    "easyocr>=1.7.2",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "pyttsx3>=2.98",  # Offline mock TTS for calibration
    "pyinstaller>=6.11",
]

[project.scripts]
retrobard = "retrobard.cli:app"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint.per-file-ignores]
# Typer declares options as argument defaults
"src/retrobard/cli.py" = ["B008"]
